<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTTH System – Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Optionally include an icon font such as Font Awesome -->
    <script src="https://kit.fontawesome.com/yourkit.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="brand">STFTTH System</div>
        <div class="user-actions">
            <i class="fas fa-bell"></i>
            <img src="/path/to/avatar.png" alt="User" class="avatar" />
        </div>
    </header>

    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="#" class="active"><i class="fas fa-chart-line"></i>Dashboard</a></li>
                <li><a href="#"><i class="fas fa-file-invoice-dollar"></i>Finanças</a></li>
                <li><a href="#"><i class="fas fa-network-wired"></i>NOC</a></li>
                <li><a href="#"><i class="fas fa-users"></i>CRM</a></li>
                <li><a href="#"><i class="fas fa-tools"></i>Operação de Campo</a></li>
                <li><a href="#"><i class="fas fa-chart-pie"></i>Relatórios</a></li>
            </ul>
        </nav>
    </aside>

    <div class="panel-frame"><main class="content">
        <section class="grid">
            <article class="card">
                <h3>Receitas Mensais</h3>
                <p>R$ 152.300,00</p>
            </article>
            <article class="card">
                <h3>Tickets Abertos</h3>
                <p>12</p>
            </article>
            <article class="card">
                <h3>Status da Rede</h3>
                <p>Operando Normalmente</p>
            </article>
            <article class="card">
                <h3>Novas Vendas</h3>
                <p>34 contratos</p>
            </article>
        </section>
    </main></div>

    <footer class="footer">
        © 2026 FTTH System – Versão 1.0.0
    </footer>
</body>
</html>
